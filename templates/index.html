<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #140b0f;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e8ecf5;
      --muted: #9aa4bd;
      --accent1: #ff4d6d;
      --accent2: #ffb347;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }
    .blob {
      position: fixed;
      width: 480px; height: 480px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      z-index: 0;
      animation: float 14s ease-in-out infinite alternate;
    }
    .blob.one { background: var(--accent1); top: -120px; left: -120px; }
    .blob.two { background: var(--accent2); bottom: -140px; right: -120px; animation-delay: -7s; }
    @keyframes float {
      to { transform: translate(60px, 40px) scale(1.1); }
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 48px 36px 36px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ok);
      background: rgba(52, 211, 153, .1);
      border: 1px solid rgba(52, 211, 153, .3);
      border-radius: 999px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, .7);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    h1 {
      margin: 24px 0 8px;
      font-size: clamp(56px, 16vw, 96px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 17px;
      color: var(--muted);
    }
    .info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 36px;
    }
    .info div {
      padding: 14px 10px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-width: 0;
    }
    .info span {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .info strong {
      display: block;
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 480px) {
      .card { padding: 36px 20px 28px; }
      .info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>

  <main class="card">
    <div class="badge"><span class="dot"></span> Running</div>
    <h1>{{ app_name }}</h1>
    <p class="subtitle">Halo! Kamu sedang mengakses <b>{{ app_name }}</b> 🚀</p>

    <section class="info">
      <div><span>Version</span><strong>v{{ version }}</strong></div>
      <div><span>Host</span><strong title="{{ hostname }}">{{ hostname }}</strong></div>
      <div><span>Status</span><strong>Healthy</strong></div>
    </section>

    <footer>Rendered at {{ now }} · Powered by Flask</footer>
  </main>
</body>
</html>
